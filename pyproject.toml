[project]
name = "emerald-backend"
version = "0.1.0"
description = "Emerald Finance Platform - Backend"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.12.0",
    "python-dateutil>=2.9.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    "argon2-cffi>=25.1.0",
    "pyjwt[crypto]>=2.10.0",
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "dependency-injector>=4.48.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "testcontainers>=4.14.1",
    "ty>=0.0.15",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "emerald"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
