[project]
name = "emerald-backend"
version = "0.1.0"
description = "Emerald Finance Platform - Backend"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.12.0",
    "python-dateutil>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.9.0",
    "ty>=0.0.15",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "emerald"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
